name: serverest-performance

services:
  serverest:
    image: paulogoncalvesbh/serverest:${SERVEREST_VERSION:-3.2.2}
    command: ['--nodoc', '--timeout', '3600']
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/produtos']
      interval: 2s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
